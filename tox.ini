[tox]
envlist = pre-commit,min,py310,py311,py312,py313

[testenv]
deps =
    pytest
    pytest-twisted
commands =
    pytest --reactor=asyncio {posargs:tests}

[testenv:min]
basepython = python3.10
deps =
    {[testenv]deps}
    frontera==0.7.2
    scrapy==2.7.0
    w3lib==1.17.0
    cssselect<1.3  # for w3lib==1.17.0
    twisted<26  # scrapy==2.7.0's contextfactory imports a private Twisted API removed in 26.4.0

[testenv:pre-commit]
deps = pre-commit
commands = pre-commit run --all
